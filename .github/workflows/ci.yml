# 빠른 자동 검사: PR마다, 그리고 main에 들어갈 때 돈다 (5분 안팎).
# 타입 · 린트 · 포맷 · 단위 테스트 + 핵심 E2E(@core 태그: WebGL 스모크 · 4명 동기화 · 정보 차단 · 한 판 흐름 · 괴물 화면 위장 · 번들 크기).
# 전체 E2E · 지연 봇 전체 판 · 배포 검증은 full.yml(수동 실행)에서 마일스톤 마지막 병합 전에만 돌린다.
# 매 PR의 전체 E2E 결과는 개발 세션에서 직접 돌려 PR 설명에 남긴다 (DECISIONS 4절 "CI 나누기").
# private 저장소지만 비밀 값은 쓰지 않는다 (포크 PR에서도 같은 검사가 돈다).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 브라우저는 핵심 E2E 단계 직전에만 받는다
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  quick:
    # 작업 하나로 묶는다: Actions는 작업마다 분 단위로 올려 세므로 나누면 그만큼 더 든다
    name: 빠른 검사 (타입 · 린트 · 단위 · 핵심 E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # CI에는 설치된 Chromium이 없으므로 @playwright/test 버전에 맞는 Chromium을 받는다
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npm run test:e2e:core
      - name: 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-results
          path: tests/e2e/.results
          # 실패 기록 폴더(.results)가 점으로 시작해서, 켜지 않으면 올리지 않는다
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
