# 전체 검사 (수동 실행): 마일스톤의 마지막 PR을 main에 병합하기 전에 한 번 돌린다.
# Actions 탭 → "전체 검사" → Run workflow → 브랜치 고르기. 전체 E2E는 러너(GPU 없음, SwiftShader)에서 25분 안팎이 든다.
# PR마다 도는 빠른 검사는 ci.yml.
name: 전체 검사

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

env:
  # 브라우저는 E2E 작업에서만 받는다
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  e2e:
    name: 전체 E2E (브라우저 4개 · 정보 차단 · FPS · WebGL)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI에는 설치된 Chromium이 없으므로 @playwright/test 버전에 맞는 Chromium을 받는다
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npm run test:e2e
      - name: 스크린샷 · 실패 기록 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            artifacts/screens
            tests/e2e/.results
          # 실패 기록 폴더(.results)가 점으로 시작해서, 켜지 않으면 올리지 않는다
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  lag:
    name: 지연 봇 전체 판 (lag 100 · 200, 실시간)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:lag
      - name: 판 진행 기록 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lag-fullmatch
          path: artifacts/lag
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: 배포 검증 (Docker 이미지 → 컨테이너 접속)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Docker Hub 요청 제한(429)을 피하려고 같은 공식 이미지의 미러를 쓴다
      - run: npm run verify:deploy
        env:
          NODE_IMAGE: mirror.gcr.io/library/node:22-bookworm-slim
