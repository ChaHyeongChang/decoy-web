<!doctype html>
<!--
  서버 깨우기 화면. 서비스 워커(sw.js)가 미리 받아 두었다가, 잠든 서버가 깨어나는 동안 페이지 대신 보여 준다.
  서버가 깨어나면(healthz가 이 서버의 표시와 함께 답하면) 스스로 새로고침해 원래 주소(방 코드 포함)로 돌아간다.
  서버는 깨어 있는데 표시가 없으면(표시를 모르는 예전 버전으로 되돌린 경우 등) 서비스 워커를 지우고 다시 연다 — 이 화면에
  갇히는 일이 없게 하는 탈출구는 이것뿐이다. '다시 시도'는 새로고침만 한다(M13d).
  앱 셸이 캐시돼 있으면 "기다리는 동안 봇과 연습"으로 기기 안 연습을 바로 연다(`?practice=1`은 서비스 워커가 캐시에서 준다).
  90초가 지나면 "서버에 연결할 수 없어요" 안내
  게임 코드 없이 혼자 도는 페이지라 문구 · 색을 여기 직접 적는다 (문구 원본: docs/STORY_TEXT.md, 색: VISUAL_SPEC)
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DECOY — 서버를 깨우는 중</title>
    <style>
      /* 로비와 같은 그래픽 언어 (M10c): 청록 격자 배경 + 비네트, 모서리를 깎은 어두운 유리 패널 + 얇은 청록 테두리 */
      :root {
        --bg: #0b1622;
        --panel: #0f1b27;
        --edge: #1e3a4a;
        --text: #e2e8f0;
        --accent: #22d3ee;
        --accent-text: #67e8f9;
        --accent-dim: #0e7490;
        --muted: #94a3b8;
        --warn: #fbbf24;
        --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      body {
        background:
          radial-gradient(ellipse 80% 75% at 50% 50%, transparent 50%, rgba(5, 8, 12, 0.8) 100%),
          repeating-linear-gradient(0deg, rgba(34, 211, 238, 0.04) 0 1px, transparent 1px 32px),
          repeating-linear-gradient(90deg, rgba(34, 211, 238, 0.04) 0 1px, transparent 1px 32px), var(--bg);
      }
      /* 노치 · 둥근 모서리 · 제스처 띠(안전 영역) 안쪽에 둔다 (M12) */
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      }
      .card {
        --cut: 14px;
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: min(560px, 100%);
        padding: 28px 26px 24px;
        text-align: center;
        background: rgba(15, 27, 39, 0.96);
        clip-path: polygon(
          var(--cut) 0,
          calc(100% - var(--cut)) 0,
          100% var(--cut),
          100% calc(100% - var(--cut)),
          calc(100% - var(--cut)) 100%,
          var(--cut) 100%,
          0 calc(100% - var(--cut)),
          0 var(--cut)
        );
      }
      /* 1px 청록 테두리 (대각선까지 이어지는 고리) */
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: var(--accent-dim);
        clip-path: polygon(
          evenodd,
          14px 0,
          calc(100% - 14px) 0,
          100% 14px,
          100% calc(100% - 14px),
          calc(100% - 14px) 100%,
          14px 100%,
          0 calc(100% - 14px),
          0 14px,
          14px 0,
          14.4px 1px,
          1px 14.4px,
          1px calc(100% - 14.4px),
          14.4px calc(100% - 1px),
          calc(100% - 14.4px) calc(100% - 1px),
          calc(100% - 1px) calc(100% - 14.4px),
          calc(100% - 1px) 14.4px,
          calc(100% - 14.4px) 1px,
          14.4px 1px
        );
      }
      .pulse {
        position: relative;
        width: 72px;
        height: 72px;
      }
      .pulse::before,
      .pulse::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 3px solid var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 14px rgba(34, 211, 238, 0.45);
      }
      .pulse::after {
        animation: ring 1.8s ease-out infinite;
      }
      @keyframes ring {
        from {
          transform: scale(1);
          opacity: 0.9;
        }
        to {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse::after {
          animation: none;
        }
      }
      .brand {
        margin-right: -0.32em;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.32em;
        color: #ecfeff;
        text-shadow:
          0 0 2px rgba(34, 211, 238, 0.9),
          0 0 16px rgba(34, 211, 238, 0.55);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        color: var(--accent-text);
      }
      p {
        margin: 0;
        max-width: 480px;
        line-height: 1.6;
        font-size: 16px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .warn {
        color: var(--warn);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      #retry {
        background: #132433;
      }
      button {
        --cut: 8px;
        margin-top: 4px;
        min-height: 46px;
        padding: 0 28px;
        border: 0;
        background: var(--accent-dim);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        clip-path: polygon(
          var(--cut) 0,
          calc(100% - var(--cut)) 0,
          100% var(--cut),
          100% calc(100% - var(--cut)),
          calc(100% - var(--cut)) 100%,
          var(--cut) 100%,
          0 calc(100% - var(--cut)),
          0 var(--cut)
        );
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      button:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px #fff;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main data-testid="wake-page">
      <div class="card">
        <div class="pulse" aria-hidden="true"></div>
        <div class="brand">DECOY</div>
        <h1>서버를 깨우는 중…</h1>
        <p>
          무료 서버는 15분 동안 아무도 접속하지 않으면 잠들어요. 깨어나는 데 1분쯤 걸릴 수 있어요. 이 화면을
          그대로 두면 자동으로 연결돼요.
        </p>
        <!-- 매초 바뀌는 숫자는 스크린 리더가 계속 읽지 않게 숨기고, 경고만 알린다 -->
        <p class="muted" id="elapsed" aria-hidden="true">0초째 기다리는 중</p>
        <div role="status" aria-live="polite">
          <p class="warn" id="offline" hidden>
            인터넷 연결이 끊겨 있어요. 와이파이나 데이터를 확인해 주세요.
          </p>
          <p class="warn" id="slow" hidden>
            서버에 연결할 수 없어요. 기다리는 동안 봇과 연습을 하거나, 아래 버튼으로 다시 시도해 주세요.
          </p>
        </div>
        <div class="actions">
          <button type="button" id="practice" data-testid="wake-practice" hidden>기다리는 동안 봇과 연습</button>
          <button type="button" id="retry" hidden>다시 시도</button>
        </div>
      </div>
    </main>
    <script>
      (() => {
        const MARK_HEADER = 'x-decoy-server';
        const POLL_MS = 2000;
        const REQUEST_TIMEOUT_MS = 30000;
        const SLOW_MS = 90000;
        // 깨어났다고 보고 새로고침했는데 또 이 화면이 뜨는 일이 짧은 시간에 반복되면 자동 새로고침을 멈춘다.
        // 기기 저장 키 목록(client/src/storageKeys.ts)의 wakeReloads와 같은 키 (tests/unit/storage-keys.test.ts가 대조)
        const RELOAD_KEY = 'decoy:wakeReloads';
        const RELOAD_WINDOW_MS = 60000;
        const MAX_RELOADS = 3;
        const startedAt = Date.now();
        const elapsed = document.getElementById('elapsed');
        const offline = document.getElementById('offline');
        const slow = document.getElementById('slow');
        const retry = document.getElementById('retry');
        const practice = document.getElementById('practice');
        let done = false;

        function recentReloads() {
          try {
            const list = JSON.parse(sessionStorage.getItem(RELOAD_KEY) || '[]');
            return Array.isArray(list) ? list.filter((t) => Date.now() - t < RELOAD_WINDOW_MS) : [];
          } catch {
            return [];
          }
        }

        function reloadOnce() {
          const list = recentReloads();
          if (list.length >= MAX_RELOADS) {
            done = true;
            slow.hidden = false;
            retry.hidden = false;
            return;
          }
          try {
            sessionStorage.setItem(RELOAD_KEY, JSON.stringify([...list, Date.now()]));
          } catch {
            // 저장이 안 되면 그냥 새로고침한다
          }
          done = true;
          location.reload();
        }

        function tick() {
          const seconds = Math.floor((Date.now() - startedAt) / 1000);
          elapsed.textContent = `${seconds}초째 기다리는 중`;
          offline.hidden = navigator.onLine;
          if (Date.now() - startedAt > SLOW_MS) {
            slow.hidden = false;
            retry.hidden = false;
          }
        }

        /** 'awake' = 이 서버가 깨어 있다, 'unmarked' = 서버는 답하는데 표시가 없다(예전 버전), 'asleep' = 아직 */
        async function check() {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
          try {
            const res = await fetch('healthz', { cache: 'no-store', signal: ctrl.signal });
            if (!res.ok) return 'asleep';
            if (res.headers.get(MARK_HEADER) === '1') return 'awake';
            return (await res.text()).trim() === 'ok' ? 'unmarked' : 'asleep';
          } catch {
            return 'asleep';
          } finally {
            clearTimeout(timer);
          }
        }

        /** 서비스 워커를 지우고 다시 연다. 이후 페이지 이동은 서버로 바로 간다 (게임이 뜨면 워커를 새로 등록한다) */
        async function bypassWorker() {
          done = true;
          try {
            sessionStorage.removeItem(RELOAD_KEY);
          } catch {
            // 무시
          }
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          } catch {
            // 지우지 못해도 새로고침은 한다
          }
          location.reload();
        }

        async function poll() {
          if (done) return;
          const state = await check();
          if (state === 'awake') {
            reloadOnce();
            return;
          }
          if (state === 'unmarked') {
            bypassWorker();
            return;
          }
          setTimeout(poll, POLL_MS);
        }

        // 다시 시도: 새로고침만 (서비스 워커 해제는 표시 없는 서버를 만났을 때만)
        retry.addEventListener('click', () => {
          done = true;
          location.reload();
        });
        // 봇과 연습: 앱 셸이 캐시돼 있을 때만 (서비스 워커가 ?practice=1을 캐시에서 준다)
        // 원래 주소의 설정(그래픽 품질 · 터치 · 디버그 등)은 남기고 방 코드만 뺀다
        practice.addEventListener('click', () => {
          done = true;
          const target = new URL('./', location.href);
          for (const [k, v] of new URL(location.href).searchParams) if (k !== 'room') target.searchParams.set(k, v);
          target.searchParams.set('practice', '1');
          location.href = target.href;
        });
        if (typeof caches !== 'undefined')
          caches
            .keys()
            .then((keys) => {
              practice.hidden = !keys.some((k) => k.startsWith('decoy-shell-'));
            })
            .catch(() => {});
        tick();
        setInterval(tick, 500);
        poll();
      })();
    </script>
  </body>
</html>
