# Render Blueprint: 저장소의 Dockerfile로 DECOY 서버 하나를 띄운다 (절차: docs/DEPLOY.md "3.4 Render")
# 방 상태가 서버 메모리에 있으므로 인스턴스는 반드시 1개다.
# 무료 플랜은 15분 동안 접속이 없으면 잠들고, 다음 접속 때 1분쯤 걸려 깨어난다 (그동안 '서버를 깨우는 중' 화면)
services:
  - type: web
    name: decoy-web
    runtime: docker
    plan: free
    # 싱가포르: Render의 아시아 리전 (한국에서 핑 70~100ms 안팎). 서비스를 만든 뒤에는 리전을 바꿀 수 없다
    region: singapore
    numInstances: 1
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # 서버 src/config.ts의 HEALTH_PATH와 같아야 한다 (tests/unit/deploy-config.test.ts가 확인)
    healthCheckPath: /healthz
    # main의 GitHub Actions 검사가 모두 통과한 커밋만 배포한다
    autoDeployTrigger: checksPass
    envVars:
      # 서버는 PORT 환경 변수로 뜬다. Render 웹 서비스의 기본 포트(10000)를 명시해 둔다
      - key: PORT
        value: '10000'
      - key: NODE_ENV
        value: production
      # 안드로이드 앱(TWA) 도메인 연결 /.well-known/assetlinks.json (M14). 값은 저장소에 두지 않는다 — 앱 패키지를 만든 뒤
      # Render 대시보드에서 넣는다 (docs/PLAY_STORE_GUIDE.md 2부). 비어 있으면 그 경로는 404
      - key: TWA_PACKAGE_NAME
        sync: false
      - key: TWA_SHA256_FINGERPRINTS
        sync: false
      # 개인정보 처리방침(/privacy, M15)의 문의처. 공개해도 되는 이메일을 대시보드에서 넣는다. 비어 있으면 "스토어의 개발자 연락처로 문의"
      - key: PRIVACY_CONTACT
        sync: false
      # 선택형 구글 로그인 · 계정 저장 (docs/ACCOUNT_PLAN.md, 사람이 할 일은 docs/LOGIN_GUIDE.md). 기본 꺼짐: Play 데이터 보안 신고를
      # 고친 뒤 대시보드에서 DECOY_LOGIN=1로 켠다. sync: false — 값을 여기 적으면 Blueprint 동기화가 대시보드 값을 덮는다.
      # 켰는데 값이 빠지거나 틀리면 꺼진 채로 뜨고 서버 로그에 빠진 이름만 적는다(값은 찍지 않는다)
      - key: DECOY_LOGIN
        sync: false
      # 구글 클라우드 OAuth 클라이언트 ID (…apps.googleusercontent.com, 웹 애플리케이션 유형). 공개돼도 되는 값이지만 저장소에는 두지 않는다
      - key: GOOGLE_CLIENT_ID
        sync: false
      # 세션 쿠키 서명 비밀: Render가 처음 한 번 무작위로 만든다. 바꾸면 모든 로그인이 풀린다(기록은 그대로)
      - key: DECOY_SESSION_SECRET
        generateValue: true
      # 계정 기록 DB(PostgreSQL) 접속 주소: Neon(싱가포르 aws-ap-southeast-1) 대시보드 Connect의 접속 문자열 그대로. 비밀번호가 든
      # 값이라 저장소에 절대 적지 않는다. 다른 Postgres(Render Postgres 등)로 옮길 때 이 값만 바꾼다 (docs/LOGIN_GUIDE.md)
      - key: DATABASE_URL
        sync: false
